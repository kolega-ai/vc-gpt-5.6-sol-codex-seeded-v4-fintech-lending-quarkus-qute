quarkus.http.port=8081
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/lending}
quarkus.datasource.username=${DB_USER:lending}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.scheduler.enabled=true
upload.directory=${UPLOAD_DIR:./uploads}
security.session-key=${SESSION_SIGNING_KEY}
security.core-key=${CORE_SIGNING_KEY}
security.directory-url=${DIRECTORY_URL:ldap://directory.internal:389}
security.directory-bind-dn=${DIRECTORY_BIND_DN:cn=svc-portal,ou=services,dc=northstar,dc=local}
security.directory-base-dn=${DIRECTORY_BASE_DN:ou=people,dc=northstar,dc=local}
security.directory-credential=${DIRECTORY_CREDENTIAL:}
core.url=${CORE_URL:http://localhost:8082}
assistant.url=${ASSISTANT_URL:http://localhost:8082}
assistant.api-key=${ASSISTANT_API_KEY}
