quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/lending}
quarkus.datasource.username=${DB_USER:lending}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error=1
quarkus.http.auth.form.landing-page=/dashboard
quarkus.http.auth.form.cookie-name=NS_SESSION
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.form.timeout=PT30M
quarkus.http.auth.form.new-cookie-interval=PT5M
quarkus.http.auth.session.encryption-key=${FORM_ENCRYPTION_KEY}
quarkus.http.auth.form.http-only-cookie=true
quarkus.security.jdbc.enabled=true
quarkus.security.jdbc.principal-query.sql=SELECT password_hash, role FROM app_user WHERE lower(email)=lower(?) AND enabled=true
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.enabled=true
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.password-index=1
quarkus.security.jdbc.principal-query.attribute-mappings.0.index=2
quarkus.security.jdbc.principal-query.attribute-mappings.0.to=groups
quarkus.rest-client.decision.url=${DECISION_URL:http://localhost:8081}
quarkus.http.limits.max-body-size=12M
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.uploads-directory=${java.io.tmpdir}/northstar-channel
quarkus.qute.strict-rendering=true
security.session-key=${SESSION_SIGNING_KEY}
quarkus.http.auth.permission.public.paths=/,/login,/register,/register/availability,/reset-password,/reset-confirm,/invite,/handoff,/assets/*,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.protected.paths=/*
quarkus.http.auth.permission.protected.policy=authenticated
